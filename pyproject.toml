[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douda"
version = "0.1.0"
description = "A terminal snake game with a shared, self-hostable leaderboard"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Douda contributors" }]
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
douda = "douda.cli:main"
douda-server = "douda.server:main"

[tool.setuptools.packages.find]
include = ["douda*"]
